name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # npm trusted publishing needs npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check the tag matches package.json
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm test

      # npm detects the OIDC environment and exchanges it for a short-lived
      # credential; no NODE_AUTH_TOKEN is stored in the repository.
      - run: npm publish --provenance --access public
